<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySentinel - Neural Core</title>
    <!-- Three.js CDN for 3D Background Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            background: #02040a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Cyberpunk Glowing Border Card */
        .welcome-card {
            position: relative;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            text-align: center;
            max-width: 520px;
            box-shadow: 0 0 50px rgba(37, 99, 235, 0.25), inset 0 0 20px rgba(59, 130, 246, 0.1);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glowing border animation */
        .welcome-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #06b6d4, #3b82f6);
            background-size: 400%;
            z-index: -1;
            opacity: 0.6;
            animation: glowingBorder 8s linear infinite;
        }

        @keyframes glowingBorder {
            0% { background-position: 0 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .icon-glow {
            font-size: 3rem;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8));
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(59, 130, 246, 1)); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            font-size: 2.1rem;
            font-weight: 800;
            margin: 1rem 0 0.25rem 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .tagline {
            font-family: 'Orbitron', sans-serif;
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.25rem;
        }

        .desc {
            color: #94a3b8;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Neon Action Buttons */
        .btn-primary {
            position: relative;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 0.9rem 1rem;
            border-radius: 10px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.8);
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        .btn-row {
            display: flex;
            gap: 1rem;
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #cbd5e1;
            padding: 0.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            flex: 1;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-secondary:hover {
            border-color: #38bdf8;
            color: white;
            background: rgba(30, 58, 138, 0.4);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #34d399;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Cyberpunk Welcome Card -->
    <div class="welcome-card">
        <div class="status-badge">
            <span class="pulse-dot"></span> NEURAL CORES ONLINE
        </div>
        
        <div class="icon-glow">⚡</div>
        
        <h1>PaySentinel</h1>
        <div class="tagline">Autonomous Fintech Risk & Recovery Ecosystem</div>
        
        <p class="desc">
            Predict payment friction, investigate root causes via intelligent multi-agents, and recover enterprise revenue with high-frequency telemetry.
        </p>
        
        <a href="/dashboard" class="btn-primary">📊 Launch Executive Dashboard</a>
        
        <div class="btn-row">
            <a href="/predict-page" class="btn-secondary">📋 Risk Predictor</a>
            <a href="/diagnose-page" class="btn-secondary">🔍 Agent Diagnosis</a>
        </div>
    </div>

    <!-- Three.js Background Animation Script -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const particlesCount = 900;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 18;
        }

        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.03,
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.8,
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 4;

        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            particlesMesh.rotation.y = elapsedTime * 0.04 + mouseX * 0.4;
            particlesMesh.rotation.x = elapsedTime * 0.025 + mouseY * 0.4;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
